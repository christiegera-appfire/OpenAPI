<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Public REST API for Configuration Manager for Jira (CMJ) 1.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<style>
  html, body { margin: 0; padding: 0; }
  #swagger-ui { max-width: 100%; }
  .topbar { display: none; }
</style>
</head>
<body>
<div id="swagger-ui"></div>

<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
  const spec = {
  "openapi": "3.0.1",
  "info": {
    "title": "Public REST API for Configuration Manager for Jira (CMJ)",
    "version": "1.0"
  },
  "servers": [
    {
      "url": "http://yourjira.com/jira/rest/configuration-manager/api/1.0"
    }
  ],
  "tags": [
    {
      "name": "Deployments",
      "description": "Manage deployments. Deployment is a two step process - first meta information is provided and then a snapshot file is uploaded. The operation is asynchronous - a separate REST endpoint is used for tracking deployment progress."
    },
    {
      "name": "Snapshots",
      "description": "Manage snapshots."
    }
  ],
  "paths": {
    "/deployments": {
      "post": {
        "tags": [
          "Deployments"
        ],
        "summary": "Create a deployment operation",
        "description": "Starts a deployment operation. Scope can be either 'system' or 'project'. Mode can be either 'merge' (default) or 'restore'.",
        "operationId": "createDeploymentOperation",
        "requestBody": {
          "description": "The deployment operation scope parameters.",
          "content": {
            "application/json": {
              "examples": {
                "System restore mode": {
                  "description": "System restore mode",
                  "value": {
                    "scope": "system",
                    "mode": "systemRestore"
                  }
                },
                "Single project mode": {
                  "description": "Single project mode",
                  "value": {
                    "scope": "project",
                    "mode": "merge",
                    "projectKey": "TEST",
                    "options": {
                      "createNewProject": true,
                      "newProjectKey": "PRJ",
                      "newProjectName": "My Project",
                      "mergeVersionsAndComponents": false
                    }
                  }
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Deployment operation created. Returns the id of the operation.",
            "headers": {
              "Location": {
                "description": "The URI for checking the progress of the deployment operation.",
                "required": true,
                "style": "simple"
              }
            },
            "content": {
              "application/json": {
                "examples": {
                  "Example Response": {
                    "description": "Example Response",
                    "value": {
                      "id": 1
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Request is invalid."
          },
          "403": {
            "description": "User does not have permissions to deploy a snapshot."
          }
        }
      }
    },
    "/deployments/{id}": {
      "get": {
        "tags": [
          "Deployments"
        ],
        "summary": "Retrieve the status of the deployment operation",
        "operationId": "getDeploymentOperation",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The deployment operation id",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Status successfully returned. Can be \"waiting\", \"running\", \"failed\", \"succeeded\".",
            "content": {
              "application/json": {
                "examples": {
                  "Running operation": {
                    "description": "Running operation",
                    "value": {
                      "id": 1,
                      "status": "running"
                    }
                  },
                  "Failed operation": {
                    "description": "Failed operation",
                    "value": {
                      "id": 1,
                      "status": "failed",
                      "reason": "Some explanation of the failure"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Request is invalid."
          },
          "403": {
            "description": "User does not have permissions to check deployment status."
          },
          "404": {
            "description": "No deployment operation with the given id."
          }
        }
      }
    },
    "/deployments/{id}/content": {
      "put": {
        "tags": [
          "Deployments"
        ],
        "summary": "Manage the snapshot content for the deployment with the given id.",
        "description": "Uploads the snapshot content. The snapshot content must be provided in a part named 'file' within a multipart/form-data body. After the content is successfully uploaded, the deployment process will start.",
        "operationId": "uploadSnapshot",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The deployment operation id",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "description": "The snapshot file to upload",
                "format": "binary"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Snapshot successfully uploaded and parsed."
          },
          "400": {
            "description": "Request is invalid - in case the type of the snapshot does not match the type of deployment operation."
          },
          "403": {
            "description": "User does not have permissions to deploy a snapshot."
          }
        }
      }
    },
    "/snapshots": {
      "get": {
        "tags": [
          "Snapshots"
        ],
        "summary": "Returns the metadata for all snapshots on the system.",
        "operationId": "getSnapshotsMetadata",
        "responses": {
          "200": {
            "description": "Metadata successfully fetched.",
            "content": {
              "application/json": {
                "examples": {
                  "Snapshots metadata response": {
                    "description": "Snapshots metadata response",
                    "value": {
                      "snapshotsMetadata": [
                        {
                          "id": 2,
                          "name": "data.zip",
                          "creationDate": 1740665507207,
                          "type": "System",
                          "jiraVersion": "10.4.1",
                          "serverId": "********",
                          "licenseSEN": "********",
                          "objectCount": 102,
                          "issueCount": 0,
                          "hasAttachmentsMetadata": false,
                          "hasAttachmentFiles": false,
                          "checkCustomFieldValues": false,
                          "includeProjectFilters": false,
                          "includeProjectBoards": false,
                          "includeAllFilters": true,
                          "includeAllBoards": true,
                          "includeAllDashboards": true,
                          "includeGlobalAppData": true,
                          "isWithIssues": false,
                          "isRecreatable": true,
                          "snapshotStatus": "SUCCESSFUL",
                          "hasAutomationRules": true,
                          "includeAutomationRules": false,
                          "includeAllAutomationRules": true,
                          "includeProjectAutomationRules": false,
                          "includeGlobalAutomationRules": false
                        },
                        {
                          "id": 1,
                          "name": "Snapshot Metadata",
                          "creationDate": 1740665506800,
                          "type": "Project",
                          "jiraVersion": "10.4.1",
                          "serverId": "********",
                          "licenseSEN": "********",
                          "objectCount": 66,
                          "issueCount": 1,
                          "hasAttachmentsMetadata": false,
                          "hasAttachmentFiles": false,
                          "checkCustomFieldValues": false,
                          "includeProjectFilters": false,
                          "includeProjectBoards": false,
                          "includeAllFilters": false,
                          "includeAllBoards": false,
                          "includeAllDashboards": false,
                          "includeGlobalAppData": false,
                          "isWithIssues": true,
                          "isRecreatable": true,
                          "snapshotStatus": "SUCCESSFUL",
                          "hasAutomationRules": true,
                          "includeAutomationRules": false,
                          "includeAllAutomationRules": false,
                          "includeProjectAutomationRules": true,
                          "includeGlobalAutomationRules": true,
                          "filter": "issuetype in ('Bug')",
                          "snapshotProjects": [
                            "HSP",
                            "MKY"
                          ],
                          "snapshotAppData": [
                            {
                              "appId": "com.botronsoft.jira.rollout.spi-test-plugin",
                              "includeGlobalConfiguration": false,
                              "appDataObjectIds": [
                                {
                                  "typeId": "type1",
                                  "objectId": "id1"
                                },
                                {
                                  "typeId": "type1",
                                  "objectId": "id2"
                                },
                                {
                                  "typeId": "type1",
                                  "objectId": "id3"
                                }
                              ]
                            }
                          ]
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Request is invalid."
          },
          "403": {
            "description": "User does not have permissions to retrieve snapshots metadata."
          }
        }
      },
      "post": {
        "tags": [
          "Snapshots"
        ],
        "summary": "Create snapshot",
        "description": "Creates a new snapshot. The scope of the snapshot can be either 'system' or 'project'. The 'options' array is not required.",
        "operationId": "createSnapshot",
        "requestBody": {
          "description": "The snapshot operation scope parameters.",
          "content": {
            "application/json": {
              "examples": {
                "Project Snapshot": {
                  "description": "Project Snapshot",
                  "value": {
                    "name": "My Project Snapshot",
                    "description": "Interesting snapshot",
                    "scope": "project",
                    "projectKey": "PRJ",
                    "filters": [
                      {
                        "filterId": 10001
                      },
                      {
                        "filterId": 10010
                      }
                    ],
                    "options": {
                      "checkCustomFieldValues": true
                    }
                  }
                },
                "System Snapshot": {
                  "description": "System Snapshot",
                  "value": {
                    "name": "My System Snapshot",
                    "description": "Interesting snapshot",
                    "scope": "system"
                  }
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Response containing metadata about the snapshot.",
            "headers": {
              "Location": {
                "description": "The URI pointing to the newly created snapshot.",
                "required": true,
                "style": "simple"
              }
            },
            "content": {
              "application/json": {
                "examples": {
                  "Example Response": {
                    "description": "Example Response",
                    "value": {
                      "id": 1,
                      "objectCount": 86
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Request is invalid. Some of the required parameters are not provided."
          },
          "403": {
            "description": "User does not have permissions to create a snapshot."
          }
        }
      }
    },
    "/snapshots/{id}": {
      "get": {
        "tags": [
          "Snapshots"
        ],
        "summary": "Retrieve snapshot",
        "description": "Returns the specified snapshot as XML.",
        "operationId": "getSnapshot",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The id of the snapshot.",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Snapshot successfully retrieved.",
            "content": {
              "text/plain": {
                "examples": {
                  "Example response": {
                    "description": "Known limitation of Swagger UI when rendering XML. Actual response is in application/xml",
                    "value": "<?xml version=\"1.1\" encoding=\"UTF-8\"?>\n<jiraconfiguration:JiraConfigurationRoot xmi:version=\"2.0\" type=\"System\" name=\"My snapshot\">\n...\n</jiraconfiguration:JiraConfigurationRoot>"
                  }
                }
              }
            }
          },
          "400": {
            "description": "Request is invalid."
          },
          "403": {
            "description": "User does not have permissions to retrieve a snapshot."
          },
          "404": {
            "description": "No snapshot with the given id."
          }
        }
      },
      "delete": {
        "tags": [
          "Snapshots"
        ],
        "summary": "Delete snapshot",
        "operationId": "deleteSnapshot",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The id of the snapshot.",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Snapshot successfully deleted."
          },
          "400": {
            "description": "Request is invalid."
          },
          "403": {
            "description": "User does not have permissions to delete a snapshot."
          },
          "404": {
            "description": "No snapshot with the given id."
          }
        }
      }
    }
  }
};

  window.onload = function() {
    window.ui = SwaggerUIBundle({
      spec: spec,
      dom_id: '#swagger-ui',
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      layout: "StandaloneLayout"
    });
  };
</script>
</body>
</html>
